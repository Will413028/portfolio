name: ZAP baseline scan

# Passive OWASP ZAP scan of the production site. Run by hand after security-relevant
# changes (headers, CSP, new routes) and record the result in docs/operations.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline against production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://portfolio-kohl-three-81.vercel.app/en
          allow_issue_writing: false
          fail_action: true
          cmd_options: -a
